{% extends './base.html' %}
{% load static %}

{% block conversation %}
  <ol id="chat-log"></ol><br>

  <form id="chat-message-form">
    <textarea id="chat-message-input" placeholder="Type message..."></textarea>
    <button id="chat-message-submit" type="button">Send</button>
  </form>

  {{ room_id|json_script:"room-name" }}

  <template id="message-template">
    <li class="message">
      <div>
        <span class="message-author"></span>
        <p class="message-content"></p>
        <time class="message-date"></time>
      </div>
    </li>
  </template>

  <script>
    const roomName = JSON.parse(document.getElementById('room-name').textContent);

    const chatSocket = new WebSocket(
      'ws://'
      + window.location.host
      + '/ws/chat/'
      + roomName
      + '/'
    );

    appendMessage = function(m) {
      const template = document.querySelector("#message-template");
      const message = template.content.cloneNode(true);

      message.querySelector(".message-author").textContent = m.username;
      message.querySelector(".message-content").textContent = m.message;

      const time = message.querySelector(".message-date");
      time.dateTime = message.created_at;
      time.textContent = new Date(m.created_at)
        .toLocaleTimeString([], {hour: 'numeric', minute:'numeric'});

      document.querySelector('#chat-log').appendChild(message);
    }

    chatSocket.onmessage = function(e) {
      const data = JSON.parse(e.data);
      if (data.type === 'chat.history') {
        document.querySelector('#chat-log').replaceChildren();
        for (const message of data.messages) {
          appendMessage(message)
        }
      }
      if (data.type === 'chat.message') {
        appendMessage(data.message)
      }
    };

    chatSocket.onclose = function(e) {
      console.error('Chat socket closed unexpectedly');
    };

    document.querySelector('#chat-message-input').focus();
    document.querySelector('#chat-message-input').onkeyup = function(e) {
      if (e.key === 'Enter') {  // enter, return
          document.querySelector('#chat-message-submit').click();
      }
    };

    document.querySelector('#chat-message-submit').onclick = function(e) {
      const messageInputDom = document.querySelector('#chat-message-input');
      const message = messageInputDom.value;
      chatSocket.send(JSON.stringify({
          'message': message
      }));
      messageInputDom.value = '';
    };
  </script>
{% endblock %}
