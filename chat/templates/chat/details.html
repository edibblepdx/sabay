<div id="profile-card"></div>

<script>
(() => {
  async function updateProfileDetail(roomId, role) {
    const detail = document.querySelector("#profile-card");

    let fetchRole = "none"
    if (role === "seeker" || role === "coordinator") {
      fetchRole = "provider"
    } else if (role === "provider") {
      fetchRole = "seeker"
    }

    const response = await fetch(`/chat/${roomId}/profile-card/${fetchRole}`);

    if (response.ok) {
      detail.innerHTML = await response.text();
    }
  }

  window.chatSocket.addEventListener("message", (e) => {
    const data = JSON.parse(e.data);

    if (data.type === "chat.history") {
      updateProfileDetail(data.room_id, data.room_role);
    }
  });
})();
</script>
