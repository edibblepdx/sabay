# Install in /etc/nginx/sites-available/sabay, included within nginx's http context.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sabay.org;

    ssl_certificate /etc/letsencrypt/live/sabay.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sabay.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;
    client_max_body_size 10m;

    location /static/ {
        alias /home/sabay/static/;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sabay.org;
    return 301 https://sabay.org$request_uri;
}

# Deployment smoke check: reachable only on the VPS, without basic auth.
# This is intentionally independent of TLS and the public authentication gate.
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location = / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host sabay.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}
